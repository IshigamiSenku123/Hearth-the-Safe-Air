<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearth — Kitchen Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="module" src="./pwa_firebase_bridge.js"></script>
<style>
:root{
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --r-xs:5px; --r-sm:8px; --r:11px; --r-lg:16px; --r-pill:999px;
  --sb-w:258px;
  /* chart hues (shared) */
  --c-lpg:#845EF7; --c-gas:#4C6EF5; --c-smoke:#909AA0;
  --c-co:#F76707; --c-temp:#F06595; --c-humid:#22B8CF;
  --theme-ease:560ms;
}
:root[data-theme="light"]{
  --bg:#E6EAEC; --bg-grid:rgba(20,25,28,.028);
  --surface:#F7F8F9; --surface-2:#FDFDFE; --sidebar:#FBFCFC;
  --ink:#15181A; --ink-2:#3D464B; --muted:#6C757B; --faint:#9AA3A8;
  --border:#D6DBDE; --border-strong:#C3CACE; --hair:#E1E5E8;
  --brand:#0C7A84; --brand-2:#095960; --brand-soft:#DCEEF0; --brand-ink:#053C42;
  --safe:#2C9A40; --safe-soft:#E2F4E6; --safe-ink:#155424;
  --warn:#D89412; --warn-soft:#FAEFD6; --warn-ink:#6B4808;
  --danger:#DC2F2F; --danger-soft:#FAE2E2; --danger-ink:#7A1414;
  --shadow-sm:0 1px 2px rgba(20,25,28,.05);
  --shadow:0 1px 2px rgba(20,25,28,.04),0 6px 20px rgba(20,25,28,.06);
  --shadow-lg:0 12px 40px rgba(20,25,28,.14);
  --oled-bg:#0A1B22; --oled-on:#6FE6D2; --oled-off:rgba(111,230,210,.09);
}
:root[data-theme="dark"]{
  --bg:#111315; --bg-grid:rgba(255,255,255,.02);
  --surface:#1B1E20; --surface-2:#23272A; --sidebar:#171A1C;
  --ink:#ECEEEF; --ink-2:#C2C9CD; --muted:#8A9297; --faint:#636B70;
  --border:#2B3033; --border-strong:#3A4145; --hair:#24282B;
  --brand:#2FB6C2; --brand-2:#57C9D3; --brand-soft:#0E343A; --brand-ink:#84E2EB;
  --safe:#51CF66; --safe-soft:#15351C; --safe-ink:#8CE59B;
  --warn:#FFC63A; --warn-soft:#38300F; --warn-ink:#FFDC82;
  --danger:#FF6B6B; --danger-soft:#3A1717; --danger-ink:#FFB3B3;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 16px 50px rgba(0,0,0,.55);
  --oled-bg:#05121A; --oled-on:#5FE0CE; --oled-off:rgba(95,224,206,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:34px 34px;
}
body,.sidebar,.topbar,.card,.tile,.panel,.chip,.btn,.seg,.seg-opt,.navlink,.kbd,.field input,.field select,.modal-card,.toast,.oled-shell,.pal,.pal-item,.dropdown,.dd-item,.contact,.tab{
  transition:background-color var(--theme-ease) ease,border-color var(--theme-ease) ease,color calc(var(--theme-ease) * .7) ease;
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:9999}
::view-transition-old(root){z-index:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid var(--bg)}
::selection{background:var(--brand-soft);color:var(--brand-ink)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:var(--sb-w) 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 10px color-mix(in srgb,var(--brand) 40%,transparent)}
.brand-mark svg{width:21px;height:21px}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.5px;line-height:1}
.brand-sub{font-family:var(--font-mono);font-size:9.5px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase;margin-top:3px}
.nav-group{padding:6px 12px}
.nav-label{font-family:var(--font-mono);font-size:9.5px;letter-spacing:2px;color:var(--faint);text-transform:uppercase;padding:14px 8px 6px}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;font-size:14px;position:relative;margin-bottom:1px}
.navlink svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.navlink:hover{background:var(--surface);color:var(--ink)}
.navlink.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.navlink.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:19px;background:var(--brand);border-radius:0 3px 3px 0}
.navlink .nl-badge{margin-left:auto;font-family:var(--font-mono);font-size:10px;background:var(--danger);color:#fff;padding:1px 6px;border-radius:99px;font-weight:600}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--hair)}
.sb-ver{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.5px;color:var(--faint);text-align:center;padding-top:10px}

.main{display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{height:62px;flex-shrink:0;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:30}
.hamburger{display:none;width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2)}
.device-switch{position:relative}
.ds-btn{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);min-width:210px}
.ds-btn:hover{border-color:var(--border-strong)}
.ds-dot{width:8px;height:8px;border-radius:99px;background:var(--safe);box-shadow:0 0 0 3px var(--safe-soft)}
.ds-dot.off{background:var(--faint);box-shadow:0 0 0 3px var(--hair)}
.ds-meta{text-align:left;line-height:1.15;flex:1;min-width:0}
.ds-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-model{font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.ds-caret{color:var(--muted);flex-shrink:0}
.dropdown{position:absolute;top:calc(100% + 8px);left:0;min-width:280px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;z-index:60;display:none}
.dropdown.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);width:100%;text-align:left}
.dd-item:hover{background:var(--surface)}
.dd-item.sel{background:var(--brand-soft)}
.dd-add{border-top:1px solid var(--hair);margin-top:4px;color:var(--brand);font-weight:600}
.spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--muted);min-width:190px}
.search-trigger:hover{border-color:var(--border-strong)}
.search-trigger .kbd{margin-left:auto}
.kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);background:var(--surface);border-radius:5px;padding:2px 6px;color:var(--muted)}
.status-chips{display:flex;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface-2);font-size:12px;font-weight:500;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.ok{color:var(--safe);border-color:color-mix(in srgb,var(--safe) 30%,var(--border))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--border));background:var(--warn-soft)}
.chip.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--danger-soft)}
.chip.mono{font-family:var(--font-mono);font-size:11.5px}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;position:relative}
.icon-btn:hover{border-color:var(--border-strong);filter:brightness(1.02)}
.icon-btn svg{width:18px;height:18px;color:var(--ink-2)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:99px;background:var(--danger);border:1.5px solid var(--surface-2)}
.avatar{width:38px;height:38px;border-radius:99px;border:2px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:13px;background:var(--surface-2)}
.avatar:hover{filter:brightness(1.03)}

.view{flex:1;overflow-y:auto;padding:26px 30px 60px}
.view-inner{max-width:1180px;margin:0 auto}
.view>*{animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.page-title{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,3vw,2.35rem);letter-spacing:-.5px;line-height:1.05}
.page-sub{color:var(--muted);font-size:14px;margin-top:5px}
.head-actions{display:flex;gap:9px;align-items:center}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);position:relative}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel-head .ph-ico{width:30px;height:30px;border-radius:var(--r-sm);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.panel-head .ph-ico svg{width:17px;height:17px}
.panel-title{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.2px}
.panel-desc{font-size:12.5px;color:var(--muted);margin-top:1px}
.panel-head .ph-right{margin-left:auto}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.bracket{position:relative}
.bracket::before,.bracket::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}
.bracket::before{top:9px;left:9px;border-top:1.5px solid var(--border-strong);border-left:1.5px solid var(--border-strong)}
.bracket::after{bottom:9px;right:9px;border-bottom:1.5px solid var(--border-strong);border-right:1.5px solid var(--border-strong)}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:16px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;border:1px solid var(--border);background:var(--surface-2);color:var(--ink);transition:transform .12s ease,filter .15s ease,background-color var(--theme-ease) ease,border-color var(--theme-ease) ease}
.btn svg{width:16px;height:16px}
.btn:hover{filter:brightness(1.03);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--border));background:var(--danger-soft)}
.btn.warn-ghost{color:var(--warn-ink);border-color:color-mix(in srgb,var(--warn) 40%,var(--border));background:var(--warn-soft)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.block{width:100%}
.btn.icon-only{padding:10px}

/* segmented control */
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg-opt{padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg-opt:hover{color:var(--ink)}
.seg-opt.on{background:var(--brand);color:#fff}

/* toggle */
.toggle{width:44px;height:25px;border-radius:99px;background:var(--border-strong);position:relative;flex-shrink:0;transition:background .2s ease}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s ease}
.toggle.on{background:var(--brand)}
.toggle.on::after{transform:translateX(19px)}
.setting-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--hair)}
.setting-row:last-child{border-bottom:none}
.sr-text{flex:1}
.sr-name{font-weight:600;font-size:14px}
.sr-desc{font-size:12.5px;color:var(--muted);margin-top:2px}

/* range slider */
.field{margin-bottom:2px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--ink-2)}
.range-wrap{position:relative}
.range-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.range-name{font-weight:600;font-size:14px}
.range-val{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--brand)}
.range-val .u{font-size:11px;color:var(--muted);margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--brand) var(--pct,50%),var(--border) var(--pct,50%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:99px;background:var(--surface-2);border:2px solid var(--brand);cursor:pointer;box-shadow:var(--shadow-sm)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:99px;background:var(--surface-2);border:2px solid var(--brand);cursor:pointer}
.field input[type=text],.field input[type=email],.field input[type=password],.field select{width:100%;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--ink);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* status dial */
.hero{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:center}
.dial-wrap{position:relative;display:grid;place-items:center}
.dial{width:250px;height:250px}
.dial-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial-status{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.5px;line-height:1}
.dial-label{font-size:12.5px;color:var(--muted);margin-top:6px;max-width:150px}
.dial-risk{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--faint);margin-top:10px;text-transform:uppercase}
.hero-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}

/* instrument tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:15px 15px 13px;position:relative;overflow:hidden}
.tile.alarm{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger),0 0 22px color-mix(in srgb,var(--danger) 22%,transparent)}
.tile.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.tile-name{font-size:13px;font-weight:600}
.tile-sensor{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin-top:2px}
.tile-dot{width:9px;height:9px;border-radius:99px;flex-shrink:0;margin-top:3px}
.dot-safe{background:var(--safe)} .dot-warn{background:var(--warn)} .dot-danger{background:var(--danger);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.tile-read{display:flex;align-items:baseline;gap:5px}
.tile-val{font-family:var(--font-mono);font-weight:600;font-size:29px;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.tile-unit{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.tile-spark{margin:10px 0 9px}
.meter{display:flex;gap:2px;height:14px;align-items:flex-end}
.seg-bar{flex:1;border-radius:1px;background:var(--ink);transition:opacity .3s ease,background-color .3s ease}
.tile-foot{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:9.5px;color:var(--faint);margin-top:7px;letter-spacing:.5px}

/* sensor detail rows */
.sensor-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.sensor-card.alarm{border-color:var(--danger)}
.sc-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sc-ico{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex-shrink:0}
.sc-ico svg{width:20px;height:20px}
.sc-big{font-family:var(--font-mono);font-weight:600;font-size:34px;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.sc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.sc-stat{text-align:left}
.sc-stat .l{font-family:var(--font-mono);font-size:9.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase}
.sc-stat .v{font-family:var(--font-mono);font-weight:600;font-size:15px;margin-top:3px}

/* tables / lists */
.list{display:flex;flex-direction:column}
.list-row{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--hair)}
.list-row:last-child{border-bottom:none}
.lr-ico{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;flex-shrink:0}
.lr-ico svg{width:16px;height:16px}
.lr-body{flex:1;min-width:0}
.lr-title{font-weight:600;font-size:14px}
.lr-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.lr-time{font-family:var(--font-mono);font-size:11px;color:var(--faint);white-space:nowrap}
.tag{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.5px;padding:2px 7px;border-radius:99px;text-transform:uppercase}
.tag.safe{background:var(--safe-soft);color:var(--safe-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag.danger{background:var(--danger-soft);color:var(--danger-ink)}
.tag.info{background:var(--brand-soft);color:var(--brand-ink)}
.tag.neutral{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--safe);margin-bottom:12px}

/* progress bars */
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .5s ease}
.telem-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair)}

.alarm-banner.crit{border-color:var(--danger);background:var(--danger-soft);animation:critpulse 1.4s ease infinite}

.ab-badge{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}

.ab-badge.clear{background:var(--safe-soft);color:var(--safe)}

.oled-shell{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:var(--shadow-sm)}

.oled{width:384px;height:192px;background:var(--oled-bg);border-radius:6px;position:relative;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.6)}
.oled svg{width:100%;height:100%;display:block}
.oled-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.13) 2px 4px);pointer-events:none;border-radius:6px}

.oled-btn{display:flex;flex-direction:column;align-items:center;gap:6px}

<div class="backdrop" id="backdrop" data-action="menu:close"></div>
<div id="app"></div>
<div class="overlay" id="overlay"></div>
<div class="pal-overlay" id="palOverlay">
  <div class="pal" role="dialog" aria-label="Command palette">
    <div class="pal-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="palInput" placeholder="Search actions, sensors, pages…" autocomplete="off"></div>
    <div class="pal-list" id="palList"></div>

  </div>

<div class="toasts" id="toasts"></div>

<script type="module">
/* ============================================================================
   SafeAir · Firebase live bridge  (integrated — supersedes pwa_firebase_bridge.js)
   ----------------------------------------------------------------------------
   STEP 3a: paste your config from Firebase Console → Project settings → General.
   Until a real apiKey is present, the app stays in SIMULATION mode so the
   prototype still demos. Set a real apiKey + databaseURL to go LIVE.
   The app's device id (state.devices[].id) MUST equal the firmware deviceName
   in NVS/Config.h — that is the /devices/{deviceId} path the ESP32 writes to.
   ============================================================================ */
const FIREBASE_CONFIG = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DATABASE_URL",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE")) {
  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getDatabase, ref, onValue, push, set, update, onChildAdded, remove } =
      await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

    const db = getDatabase(initializeApp(FIREBASE_CONFIG));
    let curId = null, subs = [];
    const clearSubs = () => { subs.forEach(u => { try { u(); } catch (e) {} }); subs = []; };

    window.SAFEAIR_FB = {
      ready: true,
      subscribe(deviceId) {
        if (!deviceId) return;
        clearSubs(); curId = deviceId;
        const base = `devices/${deviceId}`;
        subs.push(onValue(ref(db, `${base}/telemetry`), s => { const v = s.val(); if (v && window.fbApplyTelemetry) window.fbApplyTelemetry(deviceId, v); }));
        subs.push(onValue(ref(db, `${base}/heartbeat`), s => { const v = s.val(); if (v && window.fbApplyHeartbeat) window.fbApplyHeartbeat(deviceId, v); }));
        subs.push(onChildAdded(ref(db, `${base}/ack`), s => {
          const a = s.val(); if (!a) return;
          window.toast && window.toast(a.status === 'success' ? 'Command confirmed' : 'Command failed', a.message || a.cmdId || '', a.status === 'success' ? 'safe' : 'danger');
          setTimeout(() => { try { remove(s.ref); } catch (e) {} }, 6000);
        }));
        subs.push(onChildAdded(ref(db, `${base}/alerts`), s => {
          const al = s.val(); if (!al || al.level !== 'danger') return;
          window.toast && window.toast('DANGER · ' + String(al.sensor || '').toUpperCase(), 'Reading ' + al.value, 'danger');
          window.fbAddLog && window.fbAddLog(deviceId, { lvl:'danger', title:'DANGER · '+String(al.sensor||'').toUpperCase(), msg:'Reading '+al.value, t:al.ts });
        }));
        subs.push(onChildAdded(ref(db, `${base}/logs`), s => {
          const lg = s.val(); if (lg && window.fbAddLog) window.fbAddLog(deviceId, lg);
        }));
        subs.push(onValue(ref(db, `${base}/meta/info`), s => {
          const mi = s.val(); if (mi && window.fbApplyInfo) window.fbApplyInfo(deviceId, mi);
        }));
        console.log('[SafeAir] subscribed to', deviceId);
      },
      sendCommand(type, payload = {}) {
        if (!curId) return;
        const c = push(ref(db, `devices/${curId}/commands`));
        set(c, { id: c.key, type, ts: Date.now(), payload });
        console.log('[SafeAir] command →', type);
      },
      saveThresholds(obj) {
        if (!curId) return Promise.resolve();
        return update(ref(db, `devices/${curId}/meta/thresholds`), obj);
      }
    };
    if (window.onFirebaseReady) window.onFirebaseReady();
    console.log('[SafeAir] Firebase ready');
  } catch (err) {
    console.error('[SafeAir] Firebase init failed — check config / rules.', err);
    if (window.onFirebaseMissing) window.onFirebaseMissing();
  }
} else {
  console.log('[SafeAir] No Firebase config — paste keys to go live.');
  if (window.onFirebaseMissing) window.onFirebaseMissing();
}
</script>

<script>
/* ============ ICONS ============ */
const IP={
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

function groupState(g){let r='safe';CH.forEach(c=>{if(c.group!==g)return;const s=chState(c.key);if(s==='danger')r='danger';else if(s==='warning'&&r!=='danger')r='warning';});return r;}

const state={
  view:'home', theme:'light', units:'C',
  device:'kitchen-1', menuOpen:false, advOpen:true,
  lockPass:null, lockOpen:false,

  live:false, liveStatus:null, fb:'init', // fb: 'init' | 'live' | 'missing'

function dev(){return state.devices.find(d=>d.id===state.device);}
function chState(key){const c=CHMAP[key],s=state.sensors[key];if(s.value==null||c.info||c.danger==null)return 'safe';if(s.value>=c.danger)return 'danger';if(s.value>=c.warn)return 'warning';return 'safe';}
function overall(){if(state.live&&state.liveStatus)return state.liveStatus;let r='safe';for(const c of CH){const st=chState(c.key);if(st==='danger')return 'danger';if(st==='warning')r='warning';}return r;}
function risk(){let m=0;for(const c of CH){if(c.info||c.danger==null)continue;const v=state.sensors[c.key].value;if(v==null)continue;m=Math.max(m,v/c.danger);}return Math.min(1,m);}
function fmtVal(key){const c=CHMAP[key];let v=state.sensors[key].value;if(v==null)return '—';if(key==='temp'&&state.units==='F')v=v*9/5+32;return v<10?v.toFixed(1):Math.round(v).toString();}
function unitOf(key){const c=CHMAP[key];if(key==='temp')return state.units==='F'?'°F':'°C';return c.unit;}
/* ============ DRAW HELPERS ============ */
function cvar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function pol(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
function arcPath(cx,cy,r,start,sweep){const[x1,y1]=pol(cx,cy,r,start);const[x2,y2]=pol(cx,cy,r,start+sweep);const large=sweep>180?1:0;return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;}
function stColor(st){return st==='danger'?'var(--danger)':st==='warning'?'var(--warn)':'var(--safe)';}
function stWord(st){return st==='danger'?'DANGER':st==='warning'?'CAUTION':'SAFE';}

function dial(){
  const st=overall(),frac=risk(),col=stColor(st);
  let ticks='';for(let i=0;i<=10;i++){const a=225+27*i;const[x1,y1]=pol(100,100,68,a);const[x2,y2]=pol(100,100,i%5===0?60:64,a);ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--border-strong)" stroke-width="${i%5===0?2:1}"/>`;}
  const value=frac>.01?`<path d="${arcPath(100,100,82,225,270*frac)}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"/>`:'';
  return `<svg class="dial" viewBox="0 0 200 200">
    <path d="${arcPath(100,100,82,225,270)}" fill="none" stroke="var(--border)" stroke-width="13" stroke-linecap="round"/>
    ${value}${ticks}
  </svg>`;
}
function sparkline(hist,w,h,colVar){
  if(!hist||hist.length<2)return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><line x1="0" y1="'+(h-2)+'" x2="'+w+'" y2="'+(h-2)+'" stroke="'+colVar+'" stroke-width="1.4" opacity=".28"/></svg>';
  const d=hist.slice(-40),mn=Math.min(...d),mx=Math.max(...d),rng=(mx-mn)||1;
  const pts=d.map((v,i)=>[(i/(d.length-1))*w,h-((v-mn)/rng)*(h-3)-1.5]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  const id='sp'+Math.random().toString(36).slice(2,7);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${colVar}" stop-opacity=".22"/><stop offset="1" stop-color="${colVar}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${colVar}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function segMeter(key){
  const c=CHMAP[key],s=state.sensors[key],N=18;const pct=s.value==null?0:Math.min(1,s.value/c.max);const filled=Math.round(pct*N);
  const warnR=c.warn?c.warn/c.max:2,dangR=c.danger?c.danger/c.max:2;
  let out='<div class="meter">';
  for(let i=0;i<N;i++){const f=(i+.5)/N;let col=f>=dangR?'var(--danger)':f>=warnR?'var(--warn)':(c.info?'var(--brand)':'var(--safe)');const on=i<filled;out+=`<i class="seg-bar" style="background:${col};opacity:${on?1:.16};height:${on?'100%':'62%'}"></i>`;}
  return out+'</div>';
}
function chart(range){
  const W=760,H=250,pl=8,pr=8,pt=14,pb=26;const iw=W-pl-pr,ih=H-pt-pb;
  const npts={'1H':30,'24H':48,'7D':56,'30D':60}[range]||48;
  let grid='';for(let i=0;i<=4;i++){const y=pt+ih*i/4;grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--hair)" stroke-width="1"/>`;}
  let xl='';const labels={'1H':['-60m','-45m','-30m','-15m','now'],'24H':['-24h','-18h','-12h','-6h','now'],'7D':['-7d','-5d','-3d','-1d','now'],'30D':['-30d','-22d','-15d','-7d','now']}[range];
  labels.forEach((l,i)=>{const x=pl+iw*i/4;xl+=`<text x="${x}" y="${H-8}" fill="var(--faint)" font-family="var(--font-mono)" font-size="10" text-anchor="${i===0?'start':i===4?'end':'middle'}">${l}</text>`;});
  let lines='';
  CH.forEach(c=>{if(state.chartHidden[c.key])return;const h=state.sensors[c.key].history.slice(-npts);if(h.length<2)return;const mn=Math.min(...h),mx=Math.max(...h),rng=(mx-mn)||1;
    const pts=h.map((v,i)=>[pl+(i/(h.length-1))*iw,pt+ih-((v-mn)/rng)*ih*.86-ih*.07]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    lines+=`<path d="${d}" fill="none" stroke="var(${c.color})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/>`;
    lines+=`<circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="var(${c.color})"/>`;});
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">${grid}${xl}${lines}</svg>`;
}
function chartLegend(){return '<div class="chart-legend">'+CH.map(c=>`<button class="leg ${state.chartHidden[c.key]?'off':''}" data-action="chart:toggle" data-arg="${c.key}"><span class="sw" style="background:var(${c.color})"></span>${c.name}</button>`).join('')+'</div>';}

/* ============ TOASTS ============ */
function toast(title,msg,kind){
  const box=document.getElementById('toasts');const el=document.createElement('div');
  const icon={danger:'alert',safe:'checkcircle',warn:'alert',info:'bell'}[kind||'info'];
  el.className='toast '+(kind||'');
  el.innerHTML=`<span class="toast-ico" style="color:${kind==='danger'?'var(--danger)':kind==='safe'?'var(--safe)':kind==='warn'?'var(--warn)':'var(--brand)'}">${ic(icon)}</span><div class="toast-body"><div class="toast-title">${title}</div>${msg?`<div class="toast-msg">${msg}</div>`:''}</div>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('exit');setTimeout(()=>el.remove(),260);},3600);
}

/* ---- OLED simulation ---- */
function ledRow(){
  const st=overall();
  const leds=[['Blue','#3B82F6',false],['Green','var(--safe)',st==='safe'],['Yellow','var(--warn)',st==='warning'],['Red','var(--danger)',st==='danger']];
  return leds.map(([n,c,on])=>`<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:16px;height:16px;border-radius:50%;background:${on?c:'var(--border)'};box-shadow:${on?'0 0 10px '+c:'none'};transition:all .3s"></span><span class="mono" style="font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px">${n}</span></div>`).join('');
}
function oledSVG(){
  const page=state.oledPage||0,st=overall(),on='var(--oled-on)';
  const rv=k=>{const v=state.sensors[k].value;return v==null?'--':Math.round(v);};
  const T=(x,y,t,s,anchor,w)=>`<text x="${x}" y="${y}" fill="${on}" font-family="var(--font-mono)" font-size="${s}" font-weight="${w||500}" text-anchor="${anchor||'start'}">${t}</text>`;
  const inv=str=>str.split('fill="'+on+'"').join('fill="var(--oled-bg)"');
  const wifi=`<g><path d="M244 12 a10 10 0 0 0 -20 0" fill="none" stroke="${on}" stroke-width="1.5"/><path d="M240 12 a6 6 0 0 0 -12 0" fill="none" stroke="${on}" stroke-width="1.5"/><circle cx="234" cy="12" r="1.5" fill="${on}"/></g>`;
  const bar=`<line x1="8" y1="22" x2="248" y2="22" stroke="${on}" stroke-width="1" opacity=".5"/>`;
  const head=right=>`${T(8,15,'SAFEAIR',11,'start',700)}${right?T(248,15,right,10,'end',500):wifi}${bar}`;
  if(st==='danger'&&(Date.now()%1000<500)){
    return `<svg viewBox="0 0 256 128"><rect x="0" y="0" width="256" height="128" fill="${on}"/>${inv(T(128,56,'! ALARM !',26,'middle',700))}${inv(T(128,84,'DANGER DETECTED',13,'middle',600))}</svg>`;
  }
  let inner='';
  if(page===0){
    inner=`${head(new Date().toTimeString().slice(0,5))}
      ${T(128,60,stWord(st),30,'middle',700)}
      ${T(128,86,'System '+(state.armed?'armed':'disarmed'),11,'middle',500)}
      ${T(8,118,'GAS '+rv('gas'),10,'start',500)}${T(96,118,'SMK '+rv('smoke'),10,'start',500)}${T(180,118,'T '+rv('temp')+'C',10,'start',500)}`;
  } else {
    const pages=[null,'temp','lpg','gas','smoke','info'],key=pages[page];
    if(key==='info'){
      inner=`${head('5/5')}${T(8,44,'DEVICE INFO',12,'start',600)}
        ${T(8,68,'ESP32-S3 N16R8',12,'start',500)}${T(8,88,'FW v'+dev().fw,11,'start',500)}
        ${T(8,110,'WiFi '+dev().rssi+'dBm',11,'start',500)}${T(150,110,'BATT '+dev().battery+'%',11,'start',500)}`;
    } else {
      const c=CHMAP[key],s=state.sensors[key],pct=s.value==null?0:Math.min(1,s.value/c.max);
      inner=`${head(page+'/5')}
        ${T(8,42,c.name.toUpperCase(),12,'start',600)}
        ${T(8,84,fmtVal(key),40,'start',700)}${T(120,84,unitOf(key),14,'start',500)}
        <rect x="8" y="100" width="240" height="12" fill="none" stroke="${on}" stroke-width="1.5"/>
        <rect x="10" y="102" width="${(236*pct).toFixed(0)}" height="8" fill="${on}"/>`;
    }
  }
  return `<svg viewBox="0 0 256 128">${inner}</svg>`;
}

function applyTheme(t){document.documentElement.setAttribute('data-theme',t);state.theme=t;}
function setTheme(t,x,y){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!document.startViewTransition||reduce||x==null){applyTheme(t);renderShell();return;}
  const end=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  const vt=document.startViewTransition(()=>{applyTheme(t);renderShell();});
  vt.ready.then(()=>{document.documentElement.animate({clipPath:[`circle(0px at ${x}px ${y}px)`,`circle(${end}px at ${x}px ${y}px)`]},{duration:700,easing:'ease-in-out',pseudoElement:'::view-transition-new(root)'});});

let actx,beepTimer;
function ensureCtx(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beepOnce(f,d,v){ensureCtx();if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d-.02);g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d+.02);}
function startAlarmSound(){if(state.quiet)return;stopAlarmSound();beepOnce(2200,.13,.05);beepTimer=setInterval(()=>beepOnce(2200,.13,.05),620);}
function stopAlarmSound(){if(beepTimer){clearInterval(beepTimer);beepTimer=null;}}

/* ============ FIREBASE LIVE GLUE (active only when SAFEAIR_FB present) ============ */
function fmtUptime(sec){const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);return [d?d+'d':'',h?h+'h':'',m?m+'m':''].filter(Boolean).join(' ')||'0m';}
function fbApplyTelemetry(id,data){
  const dv=state.devices.find(x=>x.id===id);
  if(dv){dv.online=true;dv._lastSeen=Date.now();if(typeof data.rssi==='number')dv.rssi=data.rssi;if(typeof data.uptime==='number')dv.uptime=fmtUptime(data.uptime);if(typeof data.battery==='number')dv.battery=data.battery;}
  if(id!==state.device)return;
  const map={lpg:'lpg',methane:'gas',smoke:'smoke',temp:'temp'},s=data.sensors||{};
  Object.entries(map).forEach(([fk,ck])=>{const cell=state.sensors[ck];if(cell&&typeof s[fk]==='number'){cell.value=s[fk];cell.history.push(s[fk]);if(cell.history.length>120)cell.history.shift();}});
  if(data.alarmState)state.liveStatus=data.alarmState;
  if(overall()!==lastHomeStatus){lastHomeStatus=overall();renderShell();}else updateLive();
}
function fbApplyHeartbeat(id,hb){const dv=state.devices.find(x=>x.id===id);if(!dv)return;dv.online=true;dv._lastSeen=Date.now();if(hb.fw)dv.fw=hb.fw;if(typeof hb.uptime==='number')dv.uptime=fmtUptime(hb.uptime);if(typeof hb.battery==='number')dv.battery=hb.battery;if(id===state.device&&state.view!=='home')updateLive();}
function fbWatchdog(){if(!state.live)return;const dv=dev();if(dv&&dv._lastSeen&&Date.now()-dv._lastSeen>25000&&dv.online){dv.online=false;state.liveStatus=null;toast('Device offline','No signal for 25s — it is not protecting you now','danger');if(state.view==='home')renderShell();else updateLive();}}
function onFirebaseReady(){state.live=true;state.fb='live';lastHomeStatus=null;if(window.SAFEAIR_FB)window.SAFEAIR_FB.subscribe(state.device);renderShell();toast('Connected','Streaming from your device','safe');}
function fbAddLog(id,e){if(id!==state.device)return;const lvl=({danger:'danger',warn:'warn',warning:'warn',safe:'safe',info:'info',success:'safe'})[e.lvl||e.level]||'info';addEvent({title:e.title||'Event',msg:e.msg||e.message||'',level:lvl,tag:e.cat||e.tag||'log',icon:lvl==='danger'||lvl==='warn'?'alert':'history',cat:'system',time:e.t?new Date(e.t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):undefined});}
function fbApplyInfo(id,mi){const dv=state.devices.find(x=>x.id===id);if(!dv)return;if(mi.deviceName)dv.name=mi.deviceName;if(mi.roomName)dv.room=mi.roomName;if(mi.model)dv.model=mi.model;if(mi.mac)dv.mac=mi.mac;if(mi.fw)dv.fw=mi.fw;if(id===state.device&&['home','devices','profile'].includes(state.view))renderShell();}
setInterval(fbWatchdog,5000);

/* ============ INIT ============ */
state.events=[];            // no fabricated history; real events arrive from /logs
applyTheme('light');
renderShell();              // shows the connect / waiting state until telemetry arrives
setInterval(()=>{const c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString();},1000);
</script>
